
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Objetos 3D com GPS - AR.js</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>
</head>

<body>
  <a-scene
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; videoTexture: false; debugUIEnabled: false; sourceWidth: 1280; sourceHeight: 960;"
  >

    <!-- Câmara: posição simulada para testes -->
    <a-camera
      gps-camera="simulateLatitude: 51.049; simulateLongitude: -0.723"
      rotation-reader>
    </a-camera>

    <!-- CUBO VERMELHO: cerca de 11 metros a norte -->
    <a-box
      gps-entity-place="latitude: 51.0491; longitude: -0.723"
      material="color: #ff0000"
      scale="3 3 3"
      position="0 1.5 0">
    </a-box>

    <!-- ESFERA AZUL: cerca de 22 metros a norte -->
    <a-sphere
      gps-entity-place="latitude: 51.0492; longitude: -0.723"
      material="color: #0000ff"
      radius="2"
      position="0 2 0">
    </a-sphere>

    <!-- CILINDRO VERDE: cerca de 33 metros a norte -->
    <a-cylinder
      gps-entity-place="latitude: 51.0493; longitude: -0.723"
      material="color: #00aa00"
      radius="1.5"
      height="4"
      position="0 2 0">
    </a-cylinder>

    <!-- CONE AMARELO: cerca de 44 metros a norte -->
    <a-cone
      gps-entity-place="latitude: 51.0494; longitude: -0.723"
      material="color: #ffff00"
      radius-bottom="2"
      height="4"
      position="0 2 0">
    </a-cone>

    <!-- TEXTO: perto dos restantes objetos -->
    <a-text
      value="Ola Mundo!"
      gps-entity-place="latitude: 51.0491; longitude: -0.723"
      material="color: #ffffff"
      scale="8 8 8"
      align="center"
      position="0 5 0">
    </a-text>

  </a-scene>
</body>
</html>
